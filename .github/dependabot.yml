version: 2

registries:
  docker-hardened-images:
    type: docker-registry
    url: dhi.io
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}

updates:
  - package-ecosystem: "docker"
    directory: "/"
    registries:
      - "docker-hardened-images"
    schedule:
      interval: "daily"
      time: "03:23"
      timezone: "Europe/Oslo"
